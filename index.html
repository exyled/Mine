<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>IRUO — AR Overlay System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

:root{
  --bg:#05070c;
  --panel:rgba(7,12,20,.86);
  --cyan:#7fe8ff;
  --green:#45f4ad;
  --red:#ff3333;
  --text:#e9f9ff;
}

*{box-sizing:border-box}
html,body{
  width:100%; height:100%; margin:0; overflow:hidden;
  background:var(--bg); font-family:'Share Tech Mono', monospace; color:var(--text);
}

#app{ position:relative; width:100vw; height:100dvh; background:#000; overflow:hidden; }
#camera-wrap{ position:absolute; inset:0; background:#000; overflow:hidden; }
video{ position:absolute; width:1px; height:1px; opacity:.01; pointer-events:none; }
#output{ position:absolute; inset:0; width:100%; height:100%; display:block; background:#000; }

.bracket{ position:absolute; width:40px; height:40px; border:2px solid var(--cyan); pointer-events:none; z-index:10; filter: drop-shadow(0 0 8px rgba(127,232,255,.4)); }
.tl{top:20px;left:20px;border-right:none;border-bottom:none}
.tr{top:20px;right:20px;border-left:none;border-bottom:none}
.bl{bottom:120px;left:20px;border-right:none;border-top:none}
.br{bottom:120px;right:20px;border-left:none;border-top:none}

#topbar{
  position:absolute; top:0;left:0;right:0; height:50px; display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; background:linear-gradient(to bottom, rgba(0,10,20,.9), transparent); z-index:20; pointer-events:none;
}
.sys-title{ font-family:'Orbitron', sans-serif; font-weight:900; font-size:16px; letter-spacing:5px; color:var(--cyan); text-shadow:0 0 10px var(--cyan); }
.sys-status{ font-size:10px; letter-spacing:2px; color:var(--cyan); }

#scanline{
  position:absolute; left:0;right:0; height:2px; background:var(--cyan); opacity:.3;
  box-shadow:0 0 10px var(--cyan); animation:sweep 6s linear infinite; z-index:15; pointer-events:none;
}
@keyframes sweep{from{top:-10px}to{top:110%}}

#bottom-panel{ position:absolute; left:0;right:0;bottom:0; padding:15px; background:rgba(0,10,20,.85); z-index:20; border-top:1px solid rgba(127,232,255,.2); }
#costume-grid{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.cBtn{
  appearance:none; font-family:'Share Tech Mono', monospace; font-size:11px; letter-spacing:2px;
  color:var(--cyan); background:transparent; border:1px solid var(--cyan); padding:10px 15px;
  cursor:pointer; transition:all.2s ease; text-transform:uppercase; border-radius:4px;
}
.cBtn.active{ background:var(--cyan); color:#000; box-shadow:0 0 15px rgba(127,232,255,.6); }

#loading{
  position:fixed; inset:0; background:#000; display:flex; flex-direction:column;
  align-items:center; justify-content:center; z-index:999; gap:20px;
}
.load-logo{ font-family:'Orbitron', sans-serif; font-size:30px; letter-spacing:10px; color:var(--cyan); text-shadow:0 0 20px var(--cyan); }
#startBtn{
  padding:12px 30px; background:transparent; border:1px solid var(--cyan); color:var(--cyan);
  font-family:'Orbitron', sans-serif; font-weight:700; letter-spacing:3px; cursor:pointer;
}
#startBtn:hover{ background:var(--cyan); color:#000; }
</style>
</head>
<body>
<div id="app">
  <div id="camera-wrap">
    <video id="vid" playsinline muted autoplay></video>
    <canvas id="output"></canvas>
    <div class="bracket tl"></div><div class="bracket tr"></div>
    <div class="bracket bl"></div><div class="bracket br"></div>
    <div id="scanline"></div>
    <div id="topbar">
      <div class="sys-title">IRUO. SYS</div>
      <div class="sys-status" id="fps-counter">SCANNING...</div>
    </div>
  </div>
  <div id="bottom-panel">
    <div id="costume-grid">
      <button class="cBtn active" data-costume="none">NONE</button>
      <button class="cBtn" data-costume="catgirl">MEIDO</button>
      <button class="cBtn" data-costume="gunvarrel">GUNVARREL</button>
      <button class="cBtn" data-costume="geeks">GEEKS</button>
      <button class="cBtn" data-costume="system" style="color:var(--red); border-color:var(--red)">REPORT</button>
    </div>
  </div>
</div>

<div id="loading">
  <div class="load-logo">IRUO.</div>
  <button id="startBtn">INITIALIZE PHONEDROID</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script>
const vid = document.getElementById('vid');
const canvas = document.getElementById('output');
const ctx = canvas.getContext('2d', { alpha: false });
const loadEl = document.getElementById('loading');
const fpsEl = document.getElementById('fps-counter');

let costume = 'none';
let frame = 0;
let lastTime = performance.now();
let ready = false;
let mirrorX = true;

// Frau's Particle System
let particles =0;
const frauQuotes ='boo';

// Kimijima Report Text
let reportY = 0;
const reportLines ='boob';

function resizeCanvas(){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function P(lms, i){
  return {
    x: mirrorX? (1 - lms[i].x) * canvas.width : lms[i].x * canvas.width,
    y: lms[i].y * canvas.height,
    z: lms[i].z * canvas.width 
  };
}

const faceMesh = new FaceMesh({ locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
faceMesh.onResults(onResults);

document.getElementById('startBtn').addEventListener('click', async () => {
  document.getElementById('startBtn').textContent = 'CONNECTING...';
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 1280, height: 720 } });
  vid.srcObject = stream;
  vid.play();
  requestAnimationFrame(processFrame);
});

async function processFrame(){
  if(vid.readyState >= 2) await faceMesh.send({ image: vid });
  requestAnimationFrame(processFrame);
}

document.querySelectorAll('.cBtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cBtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    costume = btn.dataset.costume;
    if(costume === 'system') reportY = canvas.height;
  });
});

function getEulerAngles(lms) {
  const nose = P(lms, 4);
  const leftT = P(lms, 234); 
  const rightT = P(lms, 454); 
  
  const dx = rightT.x - leftT.x;
  const dy = rightT.y - leftT.y;
  const dz = rightT.z - leftT.z;
  
  const roll = Math.atan2(dy, dx);
  const yaw = Math.asin(dz / Math.hypot(dx, dy, dz));
  
  const midX = (leftT.x + rightT.x) / 2;
  const midY = (leftT.y + rightT.y) / 2;
  const midZ = (leftT.z + rightT.z) / 2;
  const pitch = Math.atan2(nose.y - midY, nose.z - midZ) + Math.PI; 
  
  return { roll, pitch: pitch * 0.1, yaw };
}

function onResults(res){
  if(!ready) { ready = true; loadEl.style.display = 'none'; }
  const W = canvas.width, H = canvas.height;
  
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  
  if(mirrorX){
    ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1);
    ctx.drawImage(res.image, 0, 0, W, H); ctx.restore();
  } else {
    ctx.drawImage(res.image, 0, 0, W, H);
  }

  // System Override (Kimijima Mode) BG
  if(costume === 'system') {
    const g = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H);
    g.addColorStop(0, 'rgba(50,0,0,0.4)');
    g.addColorStop(1, 'rgba(10,0,0,0.95)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  } else {
    ctx.fillStyle = 'rgba(0, 10, 16, 0.15)';
    ctx.fillRect(0,0,W,H);
  }

  if(res.multiFaceLandmarks && res.multiFaceLandmarks.length > 0){
    const lms = res.multiFaceLandmarks;
    const euler = getEulerAngles(lms);
    const fw = Math.hypot(P(lms,234).x - P(lms,454).x, P(lms,234).y - P(lms,454).y);
    
    if(costume === 'catgirl') drawCatGirl(lms, fw, euler);
    else if(costume === 'gunvarrel') drawGunvarrel(lms, fw, euler);
    else if(costume === 'geeks') drawFrauGeeks(lms, fw, euler);
  }

  if(costume === 'system') drawKimijimaReport(W, H);
  if(costume === 'geeks') updateParticles();
  
  ctx.restore();
  frame++;
}

// ----------------------------------------------------
// 1. NEKOMIMI (Cat Girl)
// ----------------------------------------------------
function drawCatGirl(lms, fw, euler){
  const brow = P(lms, 10);
  const leftTemp = P(lms, 103);
  const rightTemp = P(lms, 332);
  const scale = fw / 200;

  ctx.save();
  ctx.translate(brow.x, brow.y);
  ctx.rotate(euler.roll);

  // Structural HUD Tag
  ctx.fillStyle = 'rgba(0, 20, 30, 0.7)';
  ctx.strokeStyle = '#7fe8ff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.rect(fw*0.6, -fw*0.5, 160*scale, 40*scale);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#7fe8ff';
  ctx.font = `${14*scale}px 'Share Tech Mono'`;
  ctx.fillText("FILTER: MEIDO", fw*0.6 + 10, -fw*0.5 + 25*scale);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(fw*0.6, -fw*0.5 + 20*scale); ctx.stroke();

  // Ears using Bezier Curves
  function drawEar(sign) {
    ctx.save();
    ctx.translate(sign * fw * 0.35, -fw * 0.2);
    ctx.rotate(sign * 0.3 + euler.yaw * sign);
    
    // Outer Ear
    const eg = ctx.createLinearGradient(0, -fw*0.6, 0, fw*0.2);
    eg.addColorStop(0, '#ffffff');
    eg.addColorStop(1, '#ffb6c1');
    ctx.fillStyle = eg;
    
    ctx.beginPath();
    ctx.moveTo(0, -fw*0.6); // Tip
    ctx.bezierCurveTo(fw*0.15, -fw*0.3, fw*0.25, 0, fw*0.2, fw*0.2); // Outer edge
    ctx.lineTo(-fw*0.2, fw*0.2); // Base
    ctx.bezierCurveTo(-fw*0.15, 0, -fw*0.05, -fw*0.3, 0, -fw*0.6); // Inner edge
    ctx.fill();

    // Inner Cavity (Auditory Shadow)
    const ig = ctx.createRadialGradient(0, 0, 1, 0, 0, fw*0.4);
    ig.addColorStop(0, 'rgba(216,191,216, 0.8)'); // Mauve
    ig.addColorStop(1, 'rgba(216,191,216, 0)');
    ctx.fillStyle = ig;
    ctx.beginPath();
    ctx.moveTo(0, -fw*0.4);
    ctx.bezierCurveTo(fw*0.08, -fw*0.2, fw*0.12, fw*0.05, fw*0.1, fw*0.15);
    ctx.lineTo(-fw*0.1, fw*0.15);
    ctx.bezierCurveTo(-fw*0.08, fw*0.05, -fw*0.04, -fw*0.2, 0, -fw*0.4);
    ctx.fill();

    ctx.restore();
  }

  drawEar(-1); // Left
  drawEar(1);  // Right
  ctx.restore();
}

// ----------------------------------------------------
// 2. GUNVARREL (Mecha Helmet)
// ----------------------------------------------------
function drawGunvarrel(lms, fw, euler){
  const nose = P(lms, 4);
  const scale = fw / 150;

  ctx.save();
  ctx.translate(nose.x, nose.y - fw*0.1);
  ctx.rotate(euler.roll);
  
  // Transform for 3D projection
  ctx.transform(1, 0, 0, Math.cos(euler.pitch), 0, 0);

  // Cranial Dome
  const domeG = ctx.createLinearGradient(0, -fw, 0, fw*0.5);
  domeG.addColorStop(0, '#ffffff');
  domeG.addColorStop(0.8, '#888888');
  domeG.addColorStop(1, '#333333');
  ctx.fillStyle = domeG;
  ctx.beginPath();
  ctx.ellipse(0, -fw*0.2, fw*0.65, fw*0.7, 0, Math.PI, 0);
  ctx.fill();

  // Faceplate (Mandibular)
  ctx.fillStyle = '#cc0000';
  ctx.beginPath();
  ctx.moveTo(-fw*0.35, fw*0.1);
  ctx.lineTo(0, fw*0.5);
  ctx.lineTo(fw*0.35, fw*0.1);
  ctx.lineTo(fw*0.5, fw*0.3);
  ctx.lineTo(0, fw*0.75);
  ctx.lineTo(-fw*0.5, fw*0.3);
  ctx.fill();

  // Ocular Sensors (Recessed Sockets + LED Glow)
  function drawEye(sign) {
    ctx.save();
    ctx.translate(sign * fw * 0.25, -fw*0.05);
    
    // Socket
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.moveTo(sign * -fw*0.15, -fw*0.1);
    ctx.lineTo(sign * fw*0.2, -fw*0.15);
    ctx.lineTo(sign * fw*0.15, fw*0.05);
    ctx.lineTo(sign * -fw*0.1, 0);
    ctx.fill();

    // LED Glow
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 20 * scale;
    ctx.fillStyle = '#ffffaa';
    ctx.beginPath();
    ctx.moveTo(sign * -fw*0.1, -fw*0.05);
    ctx.lineTo(sign * fw*0.15, -fw*0.1);
    ctx.lineTo(sign * fw*0.1, fw*0.02);
    ctx.lineTo(sign * -fw*0.05, 0);
    ctx.fill();
    ctx.restore();
  }
  drawEye(-1); drawEye(1);

  // Golden V-Fin Antenna
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 10;
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.moveTo(0, -fw*0.25);
  ctx.lineTo(-fw*0.5, -fw*0.6);
  ctx.lineTo(-fw*0.4, -fw*0.2);
  ctx.lineTo(0, -fw*0.15);
  ctx.lineTo(fw*0.4, -fw*0.2);
  ctx.lineTo(fw*0.5, -fw*0.6);
  ctx.fill();

  // Targeting Reticle
  ctx.rotate(frame * 0.05);
  ctx.strokeStyle = '#00ff00';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, fw*0.15, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-fw*0.2, 0); ctx.lineTo(fw*0.2, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -fw*0.2); ctx.lineTo(0, fw*0.2); ctx.stroke();

  ctx.restore();
}

// ----------------------------------------------------
// 3. GEEKS (Frau Koujiro Digital Aura)
// ----------------------------------------------------
function drawFrauGeeks(lms, fw, euler){
  const leftEye = P(lms, 33);
  const rightEye = P(lms, 263);
  const nose = P(lms, 4);
  const scale = fw / 150;

  // Add particles
  if(Math.random() < 0.15) {
    particles.push({
      text: frauQuotes[Math.floor(Math.random() * frauQuotes.length)],
      x: nose.x + (Math.random() - 0.5) * fw * 2,
      y: nose.y + fw,
      vy: -1 - Math.random() * 2,
      life: 120,
      maxLife: 120
    });
  }

  // Chromatic Aberration & Terminal Wireframes
  ctx.save();
  ctx.translate(nose.x, leftEye.y);
  ctx.rotate(euler.roll);

  ctx.shadowBlur = 15;
  
  // Shift Red
  ctx.shadowColor = '#ff0000'; ctx.strokeStyle = 'rgba(255,0,0,0.8)';
  drawRetroGlasses(fw, scale, -2);
  // Shift Blue
  ctx.shadowColor = '#0000ff'; ctx.strokeStyle = 'rgba(0,0,255,0.8)';
  drawRetroGlasses(fw, scale, 2);
  // Main Green
  ctx.shadowColor = '#00ff00'; ctx.strokeStyle = '#00ff00';
  ctx.lineWidth = 3 * scale;
  drawRetroGlasses(fw, scale, 0);

  ctx.restore();

  // Occasional Glitch Slice
  if(Math.random() < 0.05) {
    const gy = Math.random() * canvas.height;
    const gh = 10 + Math.random() * 20;
    const gx = (Math.random() - 0.5) * 40;
    ctx.drawImage(canvas, 0, gy, canvas.width, gh, gx, gy, canvas.width, gh);
  }
}

function drawRetroGlasses(fw, scale, xOff) {
  ctx.beginPath();
  ctx.rect(-fw*0.45 + xOff, -fw*0.15, fw*0.4, fw*0.2); // Left lens
  ctx.rect(fw*0.05 + xOff, -fw*0.15, fw*0.4, fw*0.2);  // Right lens
  ctx.moveTo(-fw*0.05 + xOff, -fw*0.05); ctx.lineTo(fw*0.05 + xOff, -fw*0.05); // Bridge
  ctx.stroke();
}

function updateParticles() {
  ctx.font = "bold 16px 'Share Tech Mono'";
  for(let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.y += p.vy;
    p.x += Math.sin(frame * 0.1 + p.life) * 0.5;
    p.life--;
    
    ctx.fillStyle = `rgba(0, 255, 0, ${p.life / p.maxLife})`;
    ctx.fillText(p.text, p.x, p.y);
    
    if(p.life <= 0) particles.splice(i, 1);
  }
}

// ----------------------------------------------------
// 4. SYSTEM (Kimijima Report Takeover)
// ----------------------------------------------------
function drawKimijimaReport(W, H) {
  const cx = W / 2, cy = H / 2;
  
  // Pulsing Alpha
  const pulseAlpha = 0.5 + 0.5 * Math.sin(performance.now() / 200);

  // Procedural Redacted Text
  ctx.font = "10px 'Share Tech Mono'";
  ctx.fillStyle = `rgba(255, 50, 50, 0.6)`;
  reportY -= 1;
  if(reportY < -reportLines.length * 20) reportY = H;

  for(let i=0; i<reportLines.length; i++) {
    let text = reportLines[i];
    // Redaction logic
    if(Math.random() < 0.1) text = text.replace(/[a-zA-Z]/g, '█');
    ctx.fillText(text, 40, reportY + (i * 20));
    ctx.fillText(text, W/2 + 40, reportY + (i * 20) - H/2);
  }

  // Giant Red Power Symbol
  ctx.save();
  ctx.translate(cx, cy);
  ctx.shadowColor = '#ff0000';
  ctx.shadowBlur = 30 * pulseAlpha;
  ctx.strokeStyle = `rgba(255, 0, 0, ${pulseAlpha})`;
  ctx.lineWidth = 12;
  ctx.lineCap = 'round';

  ctx.beginPath();
  ctx.arc(0, 0, 80, -Math.PI * 0.35, Math.PI * 1.35);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0, -20);
  ctx.lineTo(0, -90);
  ctx.stroke();

  ctx.font = "bold 24px 'Share Tech Mono'";
  ctx.textAlign = "center";
  ctx.fillText("WARNING: SYSTEM CORRUPTION", 0, 140);
  ctx.restore();
}

</script>
</body>
</html>
