<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AIRA — IRUO SYSTEM</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#000409;
}

video{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

#three{
  position:fixed;
  inset:0;
}
</style>

</head>

<body>

<video id="video" autoplay playsinline muted></video>
<div id="three"></div>

<script>
let scene, camera, renderer;
let raycaster, mouse;

let button;
let clickable = [];

let faceMesh;
let video;

/* =========================
   START CAMERA + SYSTEM
========================= */
async function start(){

  video = document.getElementById('video');

  const stream = await navigator.mediaDevices.getUserMedia({
    video:{facingMode:"user"},
    audio:false
  });

  video.srcObject = stream;
  await video.play();

  await loadFaceMesh();

  initThree();
  loop();
}

/* =========================
   FIXED MEDIAPIPE LOAD
   (IMPORTANT CHANGE)
========================= */
async function loadFaceMesh(){

  await loadScript("https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js");
  await loadScript("https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js");
  await loadScript("https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js");
  await loadScript("https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js");

  faceMesh = new window.FaceMesh.FaceMesh({
    locateFile: (file) =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });

  faceMesh.setOptions({
    maxNumFaces:1,
    refineLandmarks:true,
    minDetectionConfidence:0.5,
    minTrackingConfidence:0.5
  });

  faceMesh.onResults(onFace);
}

/* =========================
   THREE INIT
========================= */
function initThree(){

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
  );

  camera.position.z = 5;

  renderer = new THREE.WebGLRenderer({alpha:true});
  renderer.setSize(window.innerWidth, window.innerHeight);

  document.getElementById("three").appendChild(renderer.domElement);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  createButton();

  window.addEventListener("click", onClick);
}

/* =========================
   3D FLOATING BUTTON
========================= */
function createButton(){

  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 128;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#00F5FF";
  ctx.fillRect(0,0,512,128);

  ctx.fillStyle = "#000";
  ctx.font = "bold 40px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("START SYSTEM",256,64);

  const texture = new THREE.CanvasTexture(canvas);

  const mat = new THREE.SpriteMaterial({map:texture});

  button = new THREE.Sprite(mat);
  button.scale.set(2.5,0.7,1);
  button.position.set(0,0,2);

  button.userData.clickable = true;

  clickable.push(button);
  scene.add(button);
}

/* =========================
   FACE UPDATE
========================= */
function onFace(results){

  if(!results.multiFaceLandmarks) return;

  const lm = results.multiFaceLandmarks[0];

  const eyeL = lm[33];
  const eyeR = lm[263];

  const x = ((eyeL.x + eyeR.x)/2 - 0.5) * 6;
  const y = -((eyeL.y + eyeR.y)/2 - 0.5) * 8;

  if(button){
    button.position.x = x;
    button.position.y = y;
  }
}

/* =========================
   CLICK RAYCAST
========================= */
function onClick(e){

  mouse.x = (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/window.innerHeight)*2+1;

  raycaster.setFromCamera(mouse,camera);

  const hits = raycaster.intersectObjects(clickable);

  if(hits.length > 0){
    alert("START SYSTEM ACTIVATED");
  }
}

/* =========================
   RENDER LOOP
========================= */
function loop(){
  requestAnimationFrame(loop);
  renderer.render(scene,camera);
}

/* =========================
   SCRIPT LOADER
========================= */
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=src;
    s.onload=res;
    s.onerror=rej;
    document.head.appendChild(s);
  });
}

start();
</script>

</body>
</html>
