<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#000409">
<meta name="mobile-web-app-capable" content="yes">

<title>AIRA — IRUO SYSTEM</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000409;
  font-family:'Share Tech Mono',monospace;
}

video{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
}

#three-container{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
}

</style>
</head>

<body>

<video id="video" playsinline autoplay muted></video>
<div id="three-container"></div>

<script>
'use strict';

let scene, camera3D, renderer;
let faceMesh;
let video;

let raycaster;
let mouse;

let startButton3D;
let clickable = [];

let holoGroup;

async function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src;
    s.onload=res;
    s.onerror=rej;
    document.head.appendChild(s);
  });
}

/* =========================
   START SYSTEM
========================= */
async function startSystem(){

  video=document.getElementById('video');

  const stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:'user'},
    audio:false
  });

  video.srcObject=stream;
  await video.play();

  await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js');

  faceMesh=new FaceMesh({
    locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
  });

  faceMesh.setOptions({
    maxNumFaces:1,
    refineLandmarks:true
  });

  faceMesh.onResults(onResults);

  initThree();
  loop();
}

/* =========================
   THREE INIT
========================= */
function initThree(){

  scene=new THREE.Scene();

  camera3D=new THREE.PerspectiveCamera(
    45,window.innerWidth/window.innerHeight,0.1,1000
  );

  camera3D.position.z=5;

  renderer=new THREE.WebGLRenderer({
    alpha:true,
    antialias:true
  });

  renderer.setSize(window.innerWidth,window.innerHeight);
  document.getElementById('three-container').appendChild(renderer.domElement);

  raycaster=new THREE.Raycaster();
  mouse=new THREE.Vector2();

  holoGroup=new THREE.Group();
  scene.add(holoGroup);

  createFloatingButton();

  animate();

  window.addEventListener('click',onClick);
}

/* =========================
   3D FLOATING BUTTON
========================= */
function createFloatingButton(){

  const canvas=document.createElement('canvas');
  canvas.width=512;
  canvas.height=128;

  const ctx=canvas.getContext('2d');

  ctx.fillStyle='#00F5FF';
  ctx.shadowColor='#00F5FF';
  ctx.shadowBlur=25;
  ctx.fillRect(0,0,512,128);

  ctx.fillStyle='#000';
  ctx.font='bold 42px Orbitron';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('START SYSTEM',256,64);

  const tex=new THREE.CanvasTexture(canvas);

  const mat=new THREE.SpriteMaterial({
    map:tex,
    transparent:true
  });

  startButton3D=new THREE.Sprite(mat);

  startButton3D.scale.set(2.5,0.7,1);

  startButton3D.position.set(0,0,2);

  startButton3D.userData.clickable=true;

  clickable.push(startButton3D);

  scene.add(startButton3D);
}

/* =========================
   BILLBOARD UPDATE
========================= */
function animate(){
  requestAnimationFrame(animate);

  if(startButton3D){
    startButton3D.lookAt(camera3D.position);
  }

  renderer.render(scene,camera3D);
}

/* =========================
   CLICK HANDLER
========================= */
function onClick(event){

  mouse.x=(event.clientX/window.innerWidth)*2-1;
  mouse.y=-(event.clientY/window.innerHeight)*2+1;

  raycaster.setFromCamera(mouse,camera3D);

  const hits=raycaster.intersectObjects(clickable,true);

  if(hits.length>0){

    const obj=hits[0].object;

    if(obj.userData.clickable){
      startSystem(); // triggers system start again safely
      console.log("START PRESSED");
    }
  }
}

/* =========================
   FACE TRACKING
========================= */
async function loop(){

  requestAnimationFrame(loop);

  if(faceMesh && video){
    await faceMesh.send({image:video});
  }
}

function onResults(results){

  if(!results.multiFaceLandmarks?.length) return;

  const lms=results.multiFaceLandmarks[0];

  const eyeL=lms[33];
  const eyeR=lms[263];

  const midX=(eyeL.x+eyeR.x)/2;
  const midY=(eyeL.y+eyeR.y)/2;

  holoGroup.position.set(
    (midX-0.5)*6,
    -(midY-0.5)*8,
    0
  );
}

/* =========================
   RESIZE
========================= */
window.addEventListener('resize',()=>{

  camera3D.aspect=window.innerWidth/window.innerHeight;
  camera3D.updateProjectionMatrix();

  renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
