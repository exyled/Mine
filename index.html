<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000409">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AIRA — AR System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap');

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

:root{
  --c:  #00F5FF;
  --c2: #00B4D8;
  --pk: #FF1493;
  --gn: #00FF88;
  --ye: #FFE600;
  --bg: #000409;
}

html,body{
  width:100%;height:100%;
  overflow:hidden;
  background:var(--bg);
  font-family:'Share Tech Mono',monospace;
  color:var(--c);
  touch-action:manipulation;
}

/* ── SPLASH ── */
#splash{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:28px;
  background:var(--bg);
  z-index:200;
}

.splash-logo{
  font-family:'Orbitron',sans-serif;
  font-weight:900;font-size:36px;
  letter-spacing:10px;
  color:var(--c);
  text-shadow:0 0 30px var(--c),0 0 60px rgba(0,245,255,0.3);
}

.splash-sub{
  font-size:9px;letter-spacing:4px;
  color:var(--c2);margin-top:-18px;
  text-align:center;
}

#startBtn{
  font-family:'Orbitron',sans-serif;
  font-weight:700;font-size:14px;
  letter-spacing:4px;
  color:#000;
  background:var(--c);
  border:none;
  padding:20px 44px;
  cursor:pointer;
  border-radius:2px;
  box-shadow:0 0 30px rgba(0,245,255,0.6),0 0 60px rgba(0,245,255,0.2);
  animation:pulse 2s ease-in-out infinite;
  -webkit-user-select:none;user-select:none;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 30px rgba(0,245,255,0.6),0 0 60px rgba(0,245,255,0.2);}
  50%{box-shadow:0 0 44px rgba(0,245,255,0.95),0 0 80px rgba(0,245,255,0.4);}
}

.splash-note{
  font-size:9px;letter-spacing:1.5px;
  color:rgba(0,245,255,0.4);
  text-align:center;padding:0 30px;
  line-height:2;
}

/* ── LOADING ── */
#loading{
  position:fixed;inset:0;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  gap:20px;
  background:var(--bg);
  z-index:190;
}

.ring{
  width:64px;height:64px;
  border-radius:50%;
  border:2px solid rgba(0,245,255,0.12);
  border-top-color:var(--c);
  border-right-color:var(--c);
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

#loadMsg{font-size:10px;letter-spacing:3px;color:var(--c2);text-align:center;}

.bar-wrap{width:180px;height:2px;background:rgba(0,245,255,0.1);border:1px solid rgba(0,245,255,0.2);}
#bar{height:100%;width:0;background:var(--c);box-shadow:0 0 8px var(--c);transition:width .4s;}

/* ── ERROR ── */
#errScreen{
  position:fixed;inset:0;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  gap:16px;
  background:var(--bg);
  z-index:210;
  padding:32px;
  text-align:center;
}
#errTitle{font-family:'Orbitron',sans-serif;font-size:13px;color:#FF4466;letter-spacing:3px;}
#errMsg{font-size:10px;color:rgba(255,120,120,0.75);letter-spacing:1px;line-height:2.2;max-width:320px;}
#retryBtn{
  font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:3px;
  color:var(--c);background:transparent;
  border:1px solid var(--c);padding:14px 30px;cursor:pointer;margin-top:8px;
}

/* ── MAIN APP ── */
#app{
  position:fixed;inset:0;
  display:none;flex-direction:column;
}

video{
  position:absolute;
  width:1px;height:1px;opacity:0;
  pointer-events:none;left:0;top:0;
}

#cv{
  display:block;
  width:100%;
  flex:1;
  min-height:0;
  object-fit:cover;
}

/* ── HUD ── */
#hud{
  position:absolute;inset:0;
  pointer-events:none;
  z-index:10;
}

.corner{
  position:absolute;
  width:24px;height:24px;
  border:2px solid var(--c);
  opacity:.65;
}
.corner::after{content:'';position:absolute;width:5px;height:5px;background:var(--c);box-shadow:0 0 6px var(--c);}
.tl{top:8px;left:8px;border-right:none;border-bottom:none;} .tl::after{top:-2px;left:-2px;}
.tr{top:8px;right:8px;border-left:none;border-bottom:none;}  .tr::after{top:-2px;right:-2px;}
.bl{bottom:70px;left:8px;border-right:none;border-top:none;} .bl::after{bottom:-2px;left:-2px;}
.br{bottom:70px;right:8px;border-left:none;border-top:none;} .br::after{bottom:-2px;right:-2px;}

#topbar{
  position:absolute;top:0;left:0;right:0;height:40px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  background:linear-gradient(to bottom,rgba(0,0,20,.88),transparent);
}

.sys-title{
  font-family:'Orbitron',sans-serif;
  font-weight:900;font-size:12px;letter-spacing:5px;
  text-shadow:0 0 10px var(--c);
}

.sys-right{font-size:8px;letter-spacing:2px;color:var(--c2);display:flex;align-items:center;gap:10px;}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--gn);box-shadow:0 0 6px var(--gn);animation:blink 1.4s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

#scanLine{
  position:absolute;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--c),transparent);
  animation:sweep 4s linear infinite;opacity:.2;
}
@keyframes sweep{from{top:0}to{top:100%}}

#faceLock{
  position:absolute;top:46px;left:50%;transform:translateX(-50%);
  font-size:8px;letter-spacing:3px;
  padding:3px 10px;
  border:1px solid var(--gn);color:var(--gn);
  text-shadow:0 0 8px var(--gn);box-shadow:0 0 8px rgba(0,255,136,.15);
  opacity:0;transition:opacity .3s;white-space:nowrap;
}
#faceLock.on{opacity:1;}

/* ── PANEL ── */
#panel{
  position:absolute;bottom:0;left:0;right:0;
  padding:8px 6px 12px;
  background:linear-gradient(to top,rgba(0,0,20,.97) 60%,transparent);
  z-index:20;
  pointer-events:all;
}

#btns{
  display:flex;gap:6px;
  justify-content:center;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  padding-bottom:2px;
  scrollbar-width:none;
}
#btns::-webkit-scrollbar{display:none;}

.cb{
  font-family:'Share Tech Mono',monospace;
  font-size:9px;letter-spacing:1px;
  color:var(--c);
  background:rgba(0,245,255,.05);
  border:1px solid rgba(0,245,255,.22);
  padding:7px 10px;cursor:pointer;
  border-radius:2px;white-space:nowrap;
  min-width:58px;text-align:center;
  flex-shrink:0;
  -webkit-user-select:none;user-select:none;
  transition:all .15s;
}
.cb .ic{display:block;font-size:18px;margin-bottom:2px;}
.cb.active{
  background:rgba(0,245,255,.18);border-color:var(--c);color:#fff;
  box-shadow:0 0 14px rgba(0,245,255,.35),inset 0 0 8px rgba(0,245,255,.1);
  text-shadow:0 0 8px var(--c);
}

/* flip button */
#flipBtn{
  position:absolute;top:46px;right:12px;
  width:38px;height:38px;
  border:1px solid rgba(0,245,255,.4);
  background:rgba(0,0,20,.7);
  color:var(--c);font-size:20px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border-radius:50%;z-index:30;
  pointer-events:all;
  -webkit-user-select:none;user-select:none;
}
</style>
</head>
<body>

<!-- ── SPLASH ── -->
<div id="splash">
  <div class="splash-logo">AIRA</div>
  <div class="splash-sub">AUGMENTED IDENTITY REALITY SYSTEM</div>
  <button id="startBtn" onclick="startApp()">▶ TAP TO START</button>
  <div class="splash-note">
    TAP THEN ALLOW CAMERA ACCESS WHEN PROMPTED<br>
    REQUIRES CHROME / FIREFOX ON ANDROID
  </div>
</div>

<!-- ── LOADING ── -->
<div id="loading">
  <div class="ring"></div>
  <div id="loadMsg">INITIALIZING...</div>
  <div class="bar-wrap"><div id="bar"></div></div>
</div>

<!-- ── ERROR ── -->
<div id="errScreen">
  <div id="errTitle">◈ SYSTEM ERROR</div>
  <div id="errMsg"></div>
  <button id="retryBtn" onclick="location.reload()">↺ RETRY</button>
</div>

<!-- ── MAIN APP ── -->
<div id="app">
  <video id="vid" playsinline autoplay muted></video>
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="scanLine"></div>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div id="topbar">
      <div class="sys-title">◈ AIRA</div>
      <div class="sys-right"><span class="dot"></span><span id="fpsEl">-- FPS</span></div>
    </div>
    <div id="faceLock">◉ FACE LOCKED</div>
    <button id="flipBtn" onclick="flipCamera()">⟳</button>
  </div>
  <div id="panel">
    <div id="btns">
      <button class="cb active" data-c="none"    onclick="pick(this)"><span class="ic">🔳</span>NONE</button>
      <button class="cb"        data-c="catgirl"  onclick="pick(this)"><span class="ic">🐱</span>CAT</button>
      <button class="cb"        data-c="bunny"    onclick="pick(this)"><span class="ic">🐰</span>BUNNY</button>
      <button class="cb"        data-c="witch"    onclick="pick(this)"><span class="ic">🧙</span>WITCH</button>
      <button class="cb"        data-c="angel"    onclick="pick(this)"><span class="ic">😇</span>ANGEL</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ─────────────────────────── STATE ─────────────────────────── */
let costume    = 'none';
let frame      = 0;
let glitch     = 0;
let lastT      = 0;
let fpsSmooth  = 0;
let faceMesh   = null;
let facingMode = 'user';
let processing = false;
let vid, cv, ctx;

/* ─────────────────────────── UI ─────────────────────────── */
const $ = id => document.getElementById(id);
function showEl(id,d='flex'){ $(id).style.display=d; }
function hideEl(id){ $(id).style.display='none'; }
function setLoad(p,msg){ $('bar').style.width=p+'%'; $('loadMsg').textContent=msg; }

function showErr(title,msg){
  hideEl('loading'); hideEl('splash'); hideEl('app');
  $('errTitle').textContent='◈ '+title;
  $('errMsg').innerHTML=msg;
  showEl('errScreen');
}

function pick(btn){
  document.querySelectorAll('.cb').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  costume=btn.dataset.c;
  glitch=14;
}

/* ─────────────────────────── SCRIPT LOADER ─────────────────────────── */
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src; s.crossOrigin='anonymous';
    s.onload=res;
    s.onerror=()=>rej(new Error('Failed: '+src));
    document.head.appendChild(s);
  });
}

/* ─────────────────────────── MAIN ENTRY ─────────────────────────── */
async function startApp(){
  hideEl('splash');
  showEl('loading');
  setLoad(5,'REQUESTING CAMERA ACCESS...');

  /* 1. Camera */
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode, width:{ideal:640}, height:{ideal:480} },
      audio:false
    });
  }catch(e){
    let msg=e.message||String(e);
    if(e.name==='NotAllowedError')
      msg='Camera permission denied.<br><br>In Chrome: tap the camera icon in the address bar → Allow, then retry.';
    else if(e.name==='NotFoundError')
      msg='No camera detected on this device.';
    else if(e.name==='NotReadableError')
      msg='Camera is already in use by another app.<br>Close other camera apps and retry.';
    showErr('CAMERA ERROR',msg);
    return;
  }

  setLoad(20,'CAMERA ACTIVE — ATTACHING VIDEO...');

  /* 2. Attach stream */
  vid = $('vid');
  cv  = $('cv');
  ctx = cv.getContext('2d');
  vid.srcObject = stream;

  await new Promise((res,rej)=>{
    vid.onloadedmetadata = res;
    vid.onerror = rej;
    setTimeout(res, 3000); // safety fallback
  });

  try{ await vid.play(); }catch(e){
    showErr('PLAYBACK ERROR','Video play failed: '+e.message);
    return;
  }

  setLoad(35,'LOADING FACE MESH LIBRARY...');

  /* 3. Load MediaPipe */
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js');
  }catch(e){
    showErr('NETWORK ERROR','Could not load face detection library.<br><br>Check internet connection and retry.');
    return;
  }

  setLoad(60,'COMPILING WASM SHADERS...');

  /* 4. Init FaceMesh */
  try{
    faceMesh = new FaceMesh({
      locateFile: f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
    });
    faceMesh.setOptions({
      maxNumFaces:2,
      refineLandmarks:true,
      minDetectionConfidence:0.5,
      minTrackingConfidence:0.5
    });
    faceMesh.onResults(onResults);

    setLoad(80,'WARMING UP MODEL...');
    // First send triggers WASM compile + model download
    await faceMesh.send({image:vid});
    setLoad(100,'SYSTEM ONLINE');
  }catch(e){
    showErr('MODEL ERROR','FaceMesh init failed: '+(e.message||String(e)));
    return;
  }

  /* 5. Launch */
  await new Promise(r=>setTimeout(r,500));
  hideEl('loading');
  showEl('app');
  requestAnimationFrame(loop);
}

/* ─────────────────────────── CAMERA FLIP ─────────────────────────── */
async function flipCamera(){
  if(!vid||!vid.srcObject) return;
  facingMode = facingMode==='user' ? 'environment' : 'user';
  vid.srcObject.getTracks().forEach(t=>t.stop());
  vid.srcObject=null;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode,width:{ideal:640},height:{ideal:480}},audio:false
    });
    vid.srcObject=stream;
    await vid.play();
  }catch(e){
    facingMode = facingMode==='user'?'environment':'user'; // revert
  }
}

/* ─────────────────────────── RENDER LOOP ─────────────────────────── */
async function loop(ts){
  requestAnimationFrame(loop);
  if(!vid||vid.readyState<2||processing||!faceMesh) return;

  const dt=ts-lastT; lastT=ts;
  if(dt>0){
    fpsSmooth=fpsSmooth*.88+(1000/dt)*.12;
    if(frame%12===0) $('fpsEl').textContent=Math.round(fpsSmooth)+' FPS';
  }

  processing=true;
  try{ await faceMesh.send({image:vid}); }catch(_){}
  processing=false;
  frame++;
}

/* ─────────────────────────── RESULT CALLBACK ─────────────────────────── */
function onResults(res){
  const W=vid.videoWidth||640;
  const H=vid.videoHeight||480;
  cv.width=W; cv.height=H;

  ctx.save();
  // Mirror front-facing feed
  if(facingMode==='user'){ ctx.translate(W,0); ctx.scale(-1,1); }
  ctx.drawImage(vid,0,0,W,H);
  ctx.restore();

  // Vignette
  const v=ctx.createRadialGradient(W/2,H/2,W*.28,W/2,H/2,W*.72);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,12,.38)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);

  // Glitch
  if(glitch>0){
    ctx.globalAlpha=(glitch/14)*.42; ctx.fillStyle='#00F5FF';
    ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
    if(glitch>7){
      for(let i=0;i<4;i++){
        const gy=Math.random()*H,gh=Math.random()*9+2;
        ctx.drawImage(vid,0,gy,W,gh,Math.random()*10-5,gy,W,gh);
      }
    }
    glitch--;
  }

  const faces=res.multiFaceLandmarks;
  const hasF=faces&&faces.length>0;
  $('faceLock').classList.toggle('on',hasF);

  if(hasF){
    ctx.save();
    // Flip coordinate space so overlays sit correctly on mirrored feed
    if(facingMode==='user'){ ctx.translate(W,0); ctx.scale(-1,1); }
    for(const lms of faces) renderCostume(lms,W,H);
    ctx.restore();
  }

  drawHUD(W,H,hasF);
}

/* ─────────────────────────── COSTUME DISPATCH ─────────────────────────── */
function renderCostume(lms,W,H){
  const fw=dist(lp(lms,234,W,H),lp(lms,454,W,H));
  const sc=fw/200;
  switch(costume){
    case 'catgirl': drawCatGirl(lms,W,H,fw,sc); break;
    case 'bunny':   drawBunny  (lms,W,H,fw,sc); break;
    case 'witch':   drawWitch  (lms,W,H,fw,sc); break;
    case 'angel':   drawAngel  (lms,W,H,fw,sc); break;
    default:        drawScan   (lms,W,H);        break;
  }
}

/* ─────────────────────────── LANDMARK HELPERS ─────────────────────────── */
function lp(lms,i,W,H){ return {x:lms[i].x*W, y:lms[i].y*H}; }
function mid(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function lerp(a,b,t){ return a+(b-a)*t; }

/* ─────────────────────────── SCAN (NONE) ─────────────────────────── */
function drawScan(lms,W,H){
  ctx.strokeStyle='rgba(0,245,255,0.16)'; ctx.lineWidth=0.6;
  [[10,234,454],[33,133,362],[4,1,2],[61,291,0]].forEach(([a,b,c])=>{
    const pa=lp(lms,a,W,H),pb=lp(lms,b,W,H),pc=lp(lms,c,W,H);
    ctx.beginPath(); ctx.moveTo(pa.x,pa.y);
    ctx.lineTo(pb.x,pb.y); ctx.lineTo(pc.x,pc.y); ctx.closePath(); ctx.stroke();
  });
  ctx.fillStyle='rgba(0,245,255,0.45)';
  [10,33,263,4,61,291,152,234,454].forEach(i=>{
    const p=lp(lms,i,W,H);
    ctx.beginPath(); ctx.arc(p.x,p.y,1.8,0,Math.PI*2); ctx.fill();
  });
}

/* ─────────────────────────── CAT GIRL ─────────────────────────── */
function drawCatGirl(lms, fw, sc) {
  const eyeL = P(lms,33),  eyeR = P(lms,263);
  const eMid  = mid(eyeL, eyeR);
  const chin  = P(lms,152);
  const nTip  = P(lms,4);
  const chkL  = P(lms,205), chkR = P(lms,425);
  const dx = eyeR.x - eyeL.x;
  const dy = eyeR.y - eyeL.y;
  const ang = Math.atan2(dy, dx);

  // ── Cat Ears ──
  ctx.save();
  ctx.translate(eMid.x, eMid.y);
  ctx.rotate(ang);

  const earSize  = fw * 0.30;
  const earSprd  = fw * 0.38;
  const earY     = -(fw * 0.70);

  catEar(ctx, -earSprd, earY, earSize, sc);
  catEar(ctx,  earSprd, earY, earSize, sc);

  ctx.restore();

  // ── Whiskers ──
  ctx.save();
  ctx.lineCap    = 'round';
  ctx.lineWidth  = 1.4 * sc;
  ctx.strokeStyle= 'rgba(255,255,255,0.88)';

  const wLen = fw * 0.38;
  [[-0.18,0],[0,0],[0.18,0]].forEach(([a], i) => {
    const off = (i - 1) * 6 * sc;
    const angW= i === 0 ? 0.14 : i === 2 ? -0.14 : 0;
    // left
    ctx.beginPath();
    ctx.moveTo(chkL.x, chkL.y + off);
    ctx.lineTo(chkL.x - wLen, chkL.y + off + Math.sin(angW)*12*sc);
    ctx.stroke();
    // right
    ctx.beginPath();
    ctx.moveTo(chkR.x, chkR.y + off);
    ctx.lineTo(chkR.x + wLen, chkR.y + off + Math.sin(angW)*12*sc);
    ctx.stroke();
  });
  ctx.restore();

  // ── Blush circles ──
  ctx.save();
  ctx.globalAlpha = 0.38 + Math.sin(frame*0.03)*0.05;
  ctx.fillStyle   = '#FF69B4';
  ctx.beginPath(); ctx.ellipse(chkL.x-10*sc, chkL.y, 22*sc, 11*sc, -0.15, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(chkR.x+10*sc, chkR.y, 22*sc, 11*sc,  0.15, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // ── Pink nose dot ──
  ctx.fillStyle = '#FF69B4';
  ctx.beginPath(); ctx.arc(nTip.x, nTip.y, 4.5*sc, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.arc(nTip.x-1.5*sc, nTip.y-1.5*sc, 1.5*sc, 0, Math.PI*2); ctx.fill();

  // ── Pink collar ──
  const neckY  = chin.y + 28*sc;
  const colW   = fw * 0.55;
  const colH   = 14*sc;

  ctx.save();
  ctx.globalAlpha = 0.88;
  ctx.fillStyle   = '#FF1493';
  ctx.shadowColor = '#FF69B4'; ctx.shadowBlur = 8;
  roundRect(ctx, eMid.x - colW/2, neckY, colW, colH, 4);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Collar stripe
  ctx.fillStyle   = 'rgba(255,255,255,0.2)';
  roundRect(ctx, eMid.x - colW/2 + 4, neckY + 3, colW - 8, 4, 2);
  ctx.fill();

  // Bell
  const bellY = neckY + colH + 10*sc;
  ctx.fillStyle   = '#FFD700';
  ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.arc(eMid.x, bellY, 8*sc, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // Bell line
  ctx.strokeStyle = '#B8860B'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(eMid.x-6*sc, bellY); ctx.lineTo(eMid.x+6*sc, bellY); ctx.stroke();

  // Bell shine
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.arc(eMid.x-2.5*sc, bellY-2.5*sc, 2*sc, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();

  // ── Tail indicator (text label since we can't track body) ──
  ctx.fillStyle   = 'rgba(0,245,255,0.6)';
  ctx.font        = `${8*sc}px 'Share Tech Mono'`;
  ctx.fillText('[TAIL ACTIVE]', eMid.x + fw*0.55, chin.y + 10*sc);
}

function catEar(ctx, x, y, size, sc) {
  // Outer ear
  ctx.globalAlpha = 0.92;
  ctx.fillStyle   = '#FF1493';
  ctx.shadowColor = '#FF69B4'; ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - size*0.52, y + size);
  ctx.lineTo(x + size*0.52, y + size);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;

  // Outline
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth   = 1.5;
  ctx.stroke();

  // Inner ear
  ctx.fillStyle   = '#FFB6C1';
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.moveTo(x,             y + size*0.22);
  ctx.lineTo(x - size*0.3,  y + size*0.9);
  ctx.lineTo(x + size*0.3,  y + size*0.9);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
}
/* ─────────────────────────── BUNNY ─────────────────────────── */
function drawBunny(lms,W,H,fw,sc){
  const eL=lp(lms,33,W,H), eR=lp(lms,263,W,H);
  const eM=mid(eL,eR);
  const chin=lp(lms,152,W,H), nTip=lp(lms,4,W,H);
  const cL=lp(lms,205,W,H), cR=lp(lms,425,W,H);
  const ang=Math.atan2(eR.y-eL.y,eR.x-eL.x);

  ctx.save(); ctx.translate(eM.x,eM.y); ctx.rotate(ang);
  bunnyEar(ctx,-fw*.28,-fw*.45,fw*.13,fw*.9,-.08);
  bunnyEar(ctx, fw*.28,-fw*.45,fw*.13,fw*.9, .08);
  ctx.restore();

  ctx.save(); ctx.globalAlpha=.32; ctx.fillStyle='#FFB6C1';
  ctx.beginPath(); ctx.ellipse(cL.x-8*sc,cL.y,20*sc,10*sc,-.15,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cR.x+8*sc,cR.y,20*sc,10*sc, .15,0,Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.fillStyle='#FF9999';
  ctx.beginPath(); ctx.arc(nTip.x,nTip.y,5*sc,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.arc(nTip.x-2*sc,nTip.y-2*sc,1.8*sc,0,Math.PI*2); ctx.fill();

  bowTie(ctx,eM.x,chin.y+22*sc,fw*.22,15*sc,'#9B59B6');
}

function bunnyEar(ctx,x,y,w,h,tilt){
  ctx.save(); ctx.translate(x,y); ctx.rotate(tilt);
  ctx.fillStyle='#F5F5F5'; ctx.globalAlpha=.9;
  ctx.shadowColor='rgba(255,255,255,0.25)'; ctx.shadowBlur=6;
  ctx.beginPath(); ctx.ellipse(0,h/2,w,h/2,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='#FFB6C1'; ctx.globalAlpha=.75;
  ctx.beginPath(); ctx.ellipse(0,h*.5,w*.48,h/2*.82,0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1; ctx.restore();
}

function bowTie(ctx,cx,cy,w,h,col){
  ctx.save(); ctx.globalAlpha=.9; ctx.fillStyle=col;
  ctx.shadowColor=col; ctx.shadowBlur=6;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx-w,cy-h/2); ctx.lineTo(cx-w,cy+h/2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+w,cy-h/2); ctx.lineTo(cx+w,cy+h/2); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#7D3C98'; ctx.shadowBlur=0;
  ctx.beginPath(); ctx.ellipse(cx,cy,w*.2,h*.35,0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1; ctx.restore();
}

/* ─────────────────────────── WITCH ─────────────────────────── */
function drawWitch(lms,W,H,fw,sc){
  const eL=lp(lms,33,W,H), eR=lp(lms,263,W,H);
  const eM=mid(eL,eR), foreh=lp(lms,10,W,H);
  const ang=Math.atan2(eR.y-eL.y,eR.x-eL.x);

  ctx.save(); ctx.translate(eM.x,eM.y); ctx.rotate(ang);
  const bW=fw*.9, bH=13*sc, hY=-fw*.30, hH=fw*1.05;

  ctx.globalAlpha=.35; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(6*sc,hY+6*sc,bW/2,bH*.7,0,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;

  ctx.fillStyle='#1A0033'; ctx.shadowColor='#8B5CF6'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.ellipse(0,hY,bW/2,bH,0,0,Math.PI*2); ctx.fill();

  ctx.fillStyle='#0D001A';
  ctx.beginPath(); ctx.moveTo(-bW*.14,hY-2); ctx.lineTo(bW*.14,hY-2);
  ctx.lineTo(bW*.06,hY-hH*.55); ctx.lineTo(0,hY-hH);
  ctx.lineTo(-bW*.06,hY-hH*.55); ctx.closePath(); ctx.fill();

  ctx.fillStyle='#8B5CF6'; ctx.shadowBlur=8;
  ctx.fillRect(-bW*.13,hY-hH*.22,bW*.26,10*sc);
  ctx.strokeStyle='#FFD700'; ctx.lineWidth=1.5;
  ctx.shadowColor='#FFD700'; ctx.shadowBlur=4;
  ctx.strokeRect(-7*sc,hY-hH*.22+2,14*sc,7*sc);
  ctx.shadowBlur=0; ctx.restore();

  const t=frame*.04, cy2=lerp(foreh.y,eM.y,.5);
  [{c:'#FFD700',p:0},{c:'#FF69B4',p:2.1},{c:'#00F5FF',p:4.2}].forEach(({c,p})=>{
    const sx=eM.x+Math.cos(t+p)*fw*.65;
    const sy=cy2+Math.sin(t+p)*fw*.22;
    const sz=(2+Math.sin(t*2+p))*sc;
    ctx.fillStyle=c; star4(ctx,sx,sy,Math.max(.5,sz));
  });
}

/* ─────────────────────────── ANGEL ─────────────────────────── */
function drawAngel(lms,W,H,fw,sc){
  const eL=lp(lms,33,W,H), eR=lp(lms,263,W,H);
  const eM=mid(eL,eR), foreh=lp(lms,10,W,H);
  const ang=Math.atan2(eR.y-eL.y,eR.x-eL.x);
  const hR=fw*.36, hcy=foreh.y-fw*.18;

  // Wings
  ctx.save(); ctx.translate(eM.x,lerp(foreh.y,eM.y,.5)); ctx.rotate(ang);
  ['left','right'].forEach(side=>{
    const sg=side==='left'?-1:1;
    ctx.save(); ctx.scale(sg,1);
    const grd=ctx.createRadialGradient(fw*.4,0,0,fw*.4,0,fw*.5);
    grd.addColorStop(0,'rgba(255,255,255,0.42)');
    grd.addColorStop(1,'rgba(200,200,255,0)');
    ctx.fillStyle=grd; ctx.shadowColor='rgba(255,255,255,0.5)'; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.moveTo(18*sc,0);
    ctx.bezierCurveTo(fw*.35,-fw*.28,fw*.9,-fw*.14,fw*.88,fw*.05);
    ctx.bezierCurveTo(fw*.7,fw*.22,fw*.28,fw*.16,18*sc,fw*.04);
    ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(200,220,255,0.28)'; ctx.lineWidth=1;
    for(let i=1;i<=4;i++){
      const tt=i/5;
      ctx.beginPath(); ctx.moveTo(18*sc+tt*fw*.25,0);
      ctx.quadraticCurveTo(fw*(.25+tt*.5),-fw*.11,fw*(.35+tt*.45),fw*.02); ctx.stroke();
    }
    ctx.restore();
  }); ctx.restore();

  // Halo aura
  ctx.save(); ctx.translate(eM.x,hcy); ctx.rotate(ang);
  const grd2=ctx.createRadialGradient(0,0,hR*.5,0,0,hR*1.4);
  grd2.addColorStop(0,'rgba(255,220,50,0)');
  grd2.addColorStop(.5,'rgba(255,220,50,0.18)');
  grd2.addColorStop(1,'rgba(255,220,50,0)');
  ctx.fillStyle=grd2; ctx.beginPath(); ctx.ellipse(0,0,hR*1.4,hR*.5,0,0,Math.PI*2); ctx.fill();
  // Halo ring
  ctx.strokeStyle='#FFD700'; ctx.lineWidth=5*sc;
  ctx.shadowColor='#FFD700'; ctx.shadowBlur=18;
  ctx.beginPath(); ctx.ellipse(0,0,hR,hR*.27,0,0,Math.PI*2); ctx.stroke();
  ctx.shadowBlur=0; ctx.restore();

  // Sparkles
  const t=frame*.045;
  for(let i=0;i<6;i++){
    const a=t+i*Math.PI/3;
    const px=eM.x+Math.cos(a)*hR;
    const py=hcy+Math.sin(a)*hR*.27;
    const sz=(1.2+Math.sin(t*3+i)*.6)*3*sc;
    ctx.fillStyle='#FFD700'; ctx.globalAlpha=.75;
    star4(ctx,px,py,sz);
  }
  ctx.globalAlpha=1;
}

/* ─────────────────────────── HUD ─────────────────────────── */
function drawHUD(W,H,hasF){
  ctx.save();
  const fsz=Math.max(10,W*.016);
  ctx.font=`${fsz}px 'Share Tech Mono',monospace`;
  ctx.fillStyle='rgba(0,245,255,0.5)';
  ctx.fillText(`FRAME: ${String(frame).padStart(7,'0')}`,10,H-24);
  ctx.fillText(`MODE : ${costume.toUpperCase()}`,10,H-10);
  if(!hasF && Math.sin(frame*.12)>0){
    ctx.fillStyle='#FF4466';
    ctx.fillText('◎ SCANNING...',W-112,66);
  }
  ctx.restore();
}

/* ─────────────────────────── UTILS ─────────────────────────── */
function star4(ctx,cx,cy,r){
  if(r<0.1) return;
  ctx.save(); ctx.beginPath();
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4-Math.PI/2;
    const rr=i%2===0?r:r*.4;
    ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
