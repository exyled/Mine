<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#000409">
<meta name="mobile-web-app-capable" content="yes">

<title>AIRA — IRUO SYSTEM</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000409;
  font-family:'Share Tech Mono',monospace;
}

body{
  position:fixed;
  inset:0;
}

/* =======================
   VIDEO LAYER (BOTTOM)
======================= */
video{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
}

/* =======================
   THREE.JS CANVAS FIX
   (CRITICAL FIX)
======================= */
#three-container{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
}

#three-container canvas{
  position:fixed;
  inset:0;
  z-index:1;
}

/* =======================
   HUD LAYER
======================= */
#hud{
  position:fixed;
  inset:0;
  z-index:5;
  pointer-events:none;
}

/* scanline */
#scanline{
  position:absolute;
  left:0;
  right:0;
  height:1px;
  background:linear-gradient(90deg,transparent,#00F5FF,transparent);
  opacity:0.25;
  animation:scan 4s linear infinite;
}

@keyframes scan{
  from{ top:0; }
  to{ top:100%; }
}

.corner{
  position:absolute;
  width:24px;
  height:24px;
  border:2px solid #00F5FF;
  opacity:0.65;
}

.tl{ top:10px; left:10px; border-right:none; border-bottom:none; }
.tr{ top:10px; right:10px; border-left:none; border-bottom:none; }
.bl{ bottom:80px; left:10px; border-right:none; border-top:none; }
.br{ bottom:80px; right:10px; border-left:none; border-top:none; }

#topbar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:linear-gradient(to bottom,rgba(0,0,20,0.9),transparent);
}

.logo{
  color:#00F5FF;
  font-family:'Orbitron',sans-serif;
  font-size:12px;
  font-weight:900;
  letter-spacing:5px;
  text-shadow:0 0 10px #00F5FF;
}

.status{
  color:#00F5FF;
  font-size:9px;
  letter-spacing:2px;
}

/* =======================
   START SCREEN (TOP FIX)
======================= */
#startScreen{
  position:fixed;
  inset:0;
  z-index:9999;   /* IMPORTANT FIX */
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:28px;
  background:#000409;
}

#title{
  color:#00F5FF;
  font-family:'Orbitron',sans-serif;
  font-size:38px;
  font-weight:900;
  letter-spacing:10px;
  text-shadow:0 0 20px #00F5FF;
}

#subtitle{
  color:#00B4D8;
  font-size:10px;
  letter-spacing:4px;
}

#startBtn{
  border:none;
  background:#00F5FF;
  color:#000;
  padding:20px 40px;
  font-family:'Orbitron',sans-serif;
  font-weight:700;
  letter-spacing:4px;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 0 30px rgba(0,245,255,0.6);
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%,100%{ box-shadow:0 0 20px rgba(0,245,255,0.4); }
  50%{ box-shadow:0 0 40px rgba(0,245,255,1); }
}

#info{
  color:rgba(0,245,255,0.5);
  font-size:9px;
  text-align:center;
  line-height:2;
  letter-spacing:2px;
}

</style>
</head>

<body>

<div id="startScreen">
  <div id="title">AIRA</div>
  <div id="subtitle">AUGMENTED IDENTITY REALITY ARCHITECTURE</div>

  <button id="startBtn">▶ START SYSTEM</button>

  <div id="info">
    ALLOW CAMERA ACCESS WHEN PROMPTED<br>
    CHROME ANDROID RECOMMENDED
  </div>
</div>

<video id="video" playsinline autoplay muted></video>

<div id="three-container"></div>

<div id="hud">
  <div id="scanline"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div id="topbar">
    <div class="logo">◈ AIRA</div>
    <div class="status">IRUO ONLINE</div>
  </div>
</div>

<script>
'use strict';

let faceMesh;
let video;
let scene, camera3D, renderer, composer;
let holoGroup, catEarL, catEarR, visor;
let processing = false;

async function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=src;
    s.onload=resolve;
    s.onerror=reject;
    document.head.appendChild(s);
  });
}

document.getElementById('startBtn')
.addEventListener('click',startSystem);

async function startSystem(){

  document.getElementById('startScreen').style.display='none';

  video=document.getElementById('video');

  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},
      audio:false
    });

    video.srcObject=stream;
    await video.play();

  }catch(err){
    alert('Camera failed: '+err.message);
    return;
  }

  await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js');

  faceMesh=new FaceMesh({
    locateFile:(file)=>
      `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });

  faceMesh.setOptions({
    maxNumFaces:1,
    refineLandmarks:true,
    minDetectionConfidence:0.5,
    minTrackingConfidence:0.5
  });

  faceMesh.onResults(onResults);

  initThree();
  loop();
}

function initThree(){

  scene=new THREE.Scene();

  camera3D=new THREE.PerspectiveCamera(
    45,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
  );

  camera3D.position.z=5;

  renderer=new THREE.WebGLRenderer({
    alpha:true,
    antialias:true
  });

  renderer.setSize(window.innerWidth,window.innerHeight);

  document.getElementById('three-container')
  .appendChild(renderer.domElement);

  composer=new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene,camera3D));

  holoGroup=new THREE.Group();
  scene.add(holoGroup);

  const mat=new THREE.MeshBasicMaterial({
    color:0x00F5FF,
    transparent:true,
    opacity:0.75,
    blending:THREE.AdditiveBlending
  });

  const geo=new THREE.ConeGeometry(0.35,0.8,4);

  catEarL=new THREE.Mesh(geo,mat);
  catEarR=new THREE.Mesh(geo,mat);

  holoGroup.add(catEarL);
  holoGroup.add(catEarR);

  const visorGeo=new THREE.BoxGeometry(2.4,0.4,0.05);

  visor=new THREE.Mesh(
    visorGeo,
    new THREE.MeshBasicMaterial({
      color:0xFF1493,
      transparent:true,
      opacity:0.35,
      blending:THREE.AdditiveBlending
    })
  );

  holoGroup.add(visor);

  animate();
}

function animate(){
  requestAnimationFrame(animate);

  const t=performance.now()*0.001;

  catEarL.scale.y=1+Math.sin(t*3)*0.05;
  catEarR.scale.y=1+Math.sin(t*3)*0.05;

  visor.material.opacity=0.25+Math.sin(t*4)*0.08;

  renderer.render(scene,camera3D);
}

async function loop(){
  requestAnimationFrame(loop);

  if(processing||!faceMesh) return;

  processing=true;
  try{
    await faceMesh.send({image:video});
  }catch(e){}
  processing=false;
}

function onResults(results){
  if(!results.multiFaceLandmarks?.length) return;

  const lms=results.multiFaceLandmarks[0];

  const eyeL=lms[33];
  const eyeR=lms[263];

  const midX=(eyeL.x+eyeR.x)*0.5;
  const midY=(eyeL.y+eyeR.y)*0.5;

  holoGroup.position.set(
    (midX-0.5)*6,
    -(midY-0.5)*8,
    0
  );
}

window.addEventListener('resize',()=>{
  camera3D.aspect=window.innerWidth/window.innerHeight;
  camera3D.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>

</body>
</html>
